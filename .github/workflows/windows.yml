name: Kompiluj Elemental Duo

on:
  push:
    paths:
      - Elemental-Duo-Kompilacja-Online.zip
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Rozpakuj i zbuduj grę
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath Elemental-Duo-Kompilacja-Online.zip -DestinationPath game
          cmake -S game -B build -G 'Visual Studio 17 2022' -A x64 -DSFML_USE_STATIC_STD_LIBS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel

      - name: Udostępnij grę do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Duo-Windows-x64
          if-no-files-found: error
          path: |
            build/Release/ElementalDuo.exe
            build/Release/assets/
